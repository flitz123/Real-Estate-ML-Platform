[project]
name = "mtaa-property-intelligence"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "requests==2.34.2",
]

[tool.vercel]
entrypoint = "api.main:app"

[tool.vercel.fastapi.static]
cdn = true
